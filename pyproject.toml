[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadcheck"
version = "0.1.0"
description = "Measure what a rubric can and cannot see: separation, coverage, and the residual."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Erik Hill", email = "contact@erikhill.dev" }]
keywords = ["evaluation", "rubric", "llm-eval", "calibration", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

# Empty on purpose, and load-bearing. A tool that measures whether other
# people's instruments can fail should not ask you to trust a dependency tree
# to find out. Everything here is the standard library.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]
# The core reads a parsed dict and stays dependency-free; this only buys
# reading the YAML file for you.
promptfoo = ["pyyaml>=6"]

[project.scripts]
deadcheck = "deadcheck.cli:main"

[project.urls]
Homepage = "https://github.com/egnaro9/deadcheck"
Source = "https://github.com/egnaro9/deadcheck"

[tool.setuptools]
packages = ["deadcheck"]
